<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pending</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="f" src="../index.html"></iframe>
<script>
// Layout regression probe for src/test_layout.py: window 0 + residual exercises
// the null-row colspan, the narrow-sidebar table fit and the checked-pill class.
const f = document.getElementById('f');
const timer = setInterval(() => {
  const doc = f.contentDocument;
  const w = f.contentWindow;
  if (!doc || !doc.querySelector('.mx-cell') || !doc.querySelector('.tl-overlay')) return;
  clearInterval(timer);
  w.DSDV.state.set({ windowIndex: 0, mode: 'residual', activeTab: 'matrix' }, 'probe');
  setTimeout(() => {
    const tbl = doc.querySelector('.ranking-table');
    const pill = [...doc.querySelectorAll('.radio-pill')].find(p => p.querySelector('input').checked);
    document.title = JSON.stringify({
      scrollW: doc.documentElement.scrollWidth,
      clientW: doc.documentElement.clientWidth,
      tableScrollW: tbl.scrollWidth,
      tableHostW: tbl.parentElement.clientWidth,
      nullColspan: doc.querySelector('.ranking-table tr.inactive .rk-pr').getAttribute('colspan'),
      stripes: [...doc.querySelectorAll('.mx-cell')].filter(r => r.getAttribute('fill') === 'url(#mx-null)').length,
      pillOn: pill.classList.contains('on'),
      pillBg: getComputedStyle(pill).backgroundColor
    });
  }, 300);
}, 50);
</script>
</body>
</html>
